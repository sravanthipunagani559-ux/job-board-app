{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container">
    <div style="text-align: center; padding: 4rem 2rem;">
        <h1 style="font-size: 4rem; color: #e74c3c; margin-bottom: 1rem;">404</h1>
        <h2 style="color: #2c3e50; margin-bottom: 1rem;">Page Not Found</h2>
        <p style="color: #7f8c8d; margin-bottom: 2rem;">The page you're looking for doesn't exist or has been moved.</p>
        <a href="{{ url_for('index') }}" class="btn">← Go Home</a>
    </div>
</div>
{% endblock %}
